[package]
name = "enterprise-wire-gen"
version = "0.1.0"
edition = "2021"
description = "The wire's Java and registry, generated from the core's wire types (sim/core/src/wire)"

[[bin]]
name = "wire-gen"
path = "src/main.rs"

[dependencies]
enterprise-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
# Reads a type's serde shape into a registry (docs/binding-plan.md 1.2). In this crate only: the core gains nothing.
serde-reflection = { version = "0.6.0", default-features = false }

[dev-dependencies]
# Tests only: the core's own bytes, for the Java's codec to read (tests/java.rs).
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
