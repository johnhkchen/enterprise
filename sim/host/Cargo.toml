[package]
name = "enterprise-sim"
version = "0.1.0"
edition = "2021"
description = "Runs the Enterprise core with no game: thousands of days in seconds"

[dependencies]
enterprise-core = { path = "../core" }
# `--trace`: a journal replayed into SQLite (trace.rs).
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1.0.154"
