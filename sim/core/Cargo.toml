[package]
name = "enterprise-core"
version = "0.1.0"
edition = "2021"
description = "The Enterprise society: towns, goods, money and wagons, for any game to host"
# The tests are one binary (tests/all.rs lists them) and replay its own: not one a file.
autotests = false

[dependencies]
# Bevy's ECS alone: entities, components, systems. Single-threaded (no multi_threaded): the same inputs always give
# the same world, and it builds for WebAssembly, so a Java host can run it.
bevy_ecs = { version = "0.20", default-features = false, features = ["std"] }
# The save: every state type derives serde; the blob is postcard (compact, no std needed, builds for wasm32-wasip1).
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
# Tests only: reads a struct's field names (every dial has a name).
serde_json = "1.0.154"
# Tests only: the ECS with type names, so a test naming state the save misses can say which.
bevy_ecs = { version = "0.20", default-features = false, features = ["std", "debug"] }

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "replay"
path = "tests/replay.rs"

[[test]]
name = "scenarios"
path = "tests/scenarios.rs"

[[test]]
name = "wire_fixtures"
path = "tests/wire_fixtures.rs"
