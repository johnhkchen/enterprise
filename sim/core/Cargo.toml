[package]
name = "enterprise-core"
version = "0.1.0"
edition = "2021"
description = "The Enterprise society: towns, goods, money and wagons, for any game to host"

[dependencies]
# Bevy's ECS alone: entities, components, systems. Single-threaded (no multi_threaded): the same inputs always give
# the same world, and it builds for WebAssembly, so a Java host can run it.
bevy_ecs = { version = "0.20", default-features = false, features = ["std"] }
# The save: every state type derives serde; the blob is postcard (compact, no std needed, builds for wasm32-wasip1).
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
# Tests only: reads a struct's field names (every dial has a name).
serde_json = "1.0.154"
