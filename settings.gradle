pluginManagement {
    repositories {
        gradlePluginPortal()
    }
    plugins {
        id 'net.neoforged.moddev' version '2.0.148'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'enterprise'

include 'core'

// The Minecraft binding's plain-Java half (docs/binding-plan.md 1.5): the core run in the JVM by Chicory, the generated wire,
// its contract tests. No Minecraft classes, so :binding:test runs in seconds.
include 'binding'
