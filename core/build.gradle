plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to players on 1.21.1.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            // `-Plane=N`: a server of its own in run/lanes/N (see `just lane`), so runs can go side by side.
            gameDirectory = project.file(providers.gradleProperty('lane').map { "run/lanes/$it" }.getOrElse('run'))
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            // Its own folder: the dev server's world (core/run/world) mustn't leak its ledgers into the tests.
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'enterprise.society', 'java'  // an exported ENTERPRISE_SOCIETY=core mustn't switch this run
            systemProperty 'enterprise.gametest.report', file('run/gametest/report.tsv').absolutePath
            // `-Ponly=LedgerTests,LockerTests`: only those test classes (mixin/GameTestOnly)
            systemProperty 'enterprise.gametest.only', providers.gradleProperty('only').getOrElse('')
        }
        // The same suite with the Rust core running the society (society = core, binding/Society.java): its own folder,
        // so its world and ledgers never meet the Java-mode run's. `just gametest-core`.
        gameTestServerCore {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest-core')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'enterprise.society', 'core'
            systemProperty 'enterprise.gametest.report', file('run/gametest-core/report.tsv').absolutePath
            systemProperty 'enterprise.gametest.only', providers.gradleProperty('only').getOrElse('')
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // Flywheel and Ponder ship inside Create's jar; compiling against Create classes needs them on the classpath.
    maven {
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'dev.engine-room.flywheel'
            includeGroup 'net.createmod.ponder'
        }
    }
}

// Present in dev runs only, never published as a dependency.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Numismatics coins and bank accounts; it runs on Create. Both ship in the pack.
    compileOnly "maven.modrinth:create:${create_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:${flywheel_version}"
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    compileOnly "maven.modrinth:numismatics:${numismatics_version}"
    localRuntime "maven.modrinth:create:${create_version}"
    localRuntime "maven.modrinth:numismatics:${numismatics_version}"

    // The Rust core, run in the JVM (binding/: the module compiled to classes, Chicory, the generated wire;
    // docs/binding-plan.md 1.5). On the compile classpath and, as a library FML loads beside the mod rather than a boot
    // module, on the dev runs' (game tests included); shipped inside the mod's jar (jar-in-jar) with
    // what it brings: Chicory's runtime, wasi, wasm and log, at the binding's version (`chicory_version`).
    implementation project(':binding')
    additionalRuntimeClasspath project(':binding')
    jarJar(project(':binding'))
    ['runtime', 'wasi', 'wasm', 'log'].each { name ->
        jarJar("com.dylibso.chicory:${name}") {
            version { strictly "[${chicory_version}]"; prefer chicory_version }
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
